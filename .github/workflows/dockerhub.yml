name: Build and Push to Docker Hub

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: write

env:
  REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  call-build:
    uses: ./.github/workflows/build.yml
    with:
      registry: docker.io
      images: ${{ github.repository }}
      registry_username: ${{ secrets.DOCKERHUB_USERNAME }}
    secrets:
      registry_password: ${{ secrets.DOCKERHUB_TOKEN }}
